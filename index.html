<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>anti_vip PDF 工具箱</title>
  <meta name="description" content="本地运行的 PDF 基础工具箱。" />
  <style>
    :root {
      --ink:#073242;
      --muted:rgba(7,50,66,.66);
      --line:rgba(255,255,255,.70);
      --panel:rgba(255,255,255,.60);
      --panel2:rgba(255,255,255,.78);
      --blue:#2468ff;
      --cyan:#00d8e8;
      --violet:#7668ff;
      --pink:#ff58b8;
      --yellow:#fff057;
      --green:#44f0bd;
      --shadow:0 24px 60px rgba(0,42,66,.18), inset 0 1px 0 rgba(255,255,255,.82);
      --radius:26px;
    }
    *{box-sizing:border-box}
    html,body{min-height:100%}
    body{
      margin:0;
      color:var(--ink);
      font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",Arial,sans-serif;
      background:#03cfe2;
      overflow-x:hidden;
    }
    #scene{position:fixed;inset:0;z-index:-1;width:100vw;height:100vh;pointer-events:none}
    .app{width:min(1500px,calc(100vw - 28px));margin:14px auto 34px;display:grid;gap:14px}
    .panel{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow);backdrop-filter:blur(7px)}

    .topbar{padding:12px}
    .top-grid{display:grid;grid-template-columns:minmax(250px,360px) 1fr auto;gap:12px;align-items:center}
    .brand{min-width:0;display:flex;align-items:center;gap:12px}
    .logo{position:relative;width:48px;height:48px;flex:0 0 48px;border-radius:16px;transform:rotate(-10deg);background:linear-gradient(135deg,rgba(255,255,255,.96),rgba(255,255,255,.18)),conic-gradient(from 45deg,var(--yellow),var(--pink),var(--violet),var(--cyan),var(--yellow));box-shadow:0 14px 28px rgba(36,104,255,.22),inset 0 0 0 2px rgba(255,255,255,.75)}
    .logo:before{content:"";position:absolute;inset:11px;border:2px solid rgba(255,255,255,.90);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
    .logo:after{content:"";position:absolute;right:-4px;top:8px;width:14px;height:14px;border-radius:3px;background:rgba(255,255,255,.88);transform:rotate(18deg)}
    .brand strong{display:block;font-size:20px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .brand span{display:block;margin-top:2px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    button,.file-btn,input,textarea{font:inherit}
    button,.file-btn{min-height:40px;border:1px solid rgba(255,255,255,.76);border-radius:999px;padding:9px 14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;background:rgba(255,255,255,.62);color:var(--ink);box-shadow:0 10px 20px rgba(0,60,90,.10),inset 0 1px 0 rgba(255,255,255,.88);cursor:pointer;text-decoration:none;user-select:none;font-size:13px;font-weight:850;transition:transform .15s ease,background .15s ease,opacity .15s ease}
    button:hover,.file-btn:hover{transform:translateY(-1px);background:rgba(255,255,255,.84)}
    button:active,.file-btn:active{transform:translateY(0)}
    button:disabled{opacity:.38;cursor:not-allowed;transform:none}
    .mode-btn.active,.scope-btn.active,.tool-btn.active{color:#fff;background:linear-gradient(135deg,#073242,#2468ff 62%,#7668ff);border-color:rgba(255,255,255,.82)}
    .primary{color:#fff;background:linear-gradient(135deg,#245fff,#7668ff 54%,#ff58b8)}
    .primary:hover{background:linear-gradient(135deg,#1e55e8,#6759e9 54%,#ec4eae)}
    .print{color:#fff;background:linear-gradient(135deg,#00bfd4,#245fff)}
    .print:hover{background:linear-gradient(135deg,#00afc1,#1f56e4)}
    .dangerish{color:#782632}
    .mode-tabs,.top-actions,.page-actions,.tool-row,.scope-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
    .top-actions{justify-content:flex-end}
    #fileInput{display:none}

    .scopebar{padding:10px 12px}
    .scope-inner{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
    .scope-title{font-size:13px;font-weight:900;color:var(--ink);white-space:nowrap}
    .range-input{min-height:40px;width:min(280px,100%);border:1px solid rgba(255,255,255,.76);outline:0;border-radius:999px;background:rgba(255,255,255,.72);color:var(--ink);padding:0 14px;font-size:13px;font-weight:800}
    .range-input:disabled{opacity:.45}
    .mini-note{color:var(--muted);font-size:12px;font-weight:750;white-space:nowrap}

    .workspace{overflow:hidden}
    .workspace-head{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.52);background:rgba(255,255,255,.28)}
    .status{min-width:0;display:grid;gap:5px}
    .status strong{font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
    .status span{font-size:12px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
    .chip{min-height:38px;display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.70);border-radius:999px;padding:0 12px;background:rgba(255,255,255,.50);color:var(--muted);font-size:13px;font-weight:850;white-space:nowrap}

    .toolbars{border-bottom:1px solid rgba(255,255,255,.44);background:rgba(255,255,255,.18)}
    .mode-toolbar{display:none;padding:12px 14px;grid-template-columns:1fr auto;gap:10px;align-items:center}
    .mode-toolbar.active{display:grid}
    .field{min-height:40px;display:inline-flex;align-items:center;gap:8px;padding:0 10px 0 12px;border:1px solid rgba(255,255,255,.70);border-radius:999px;background:rgba(255,255,255,.50);color:var(--muted);font-size:13px;font-weight:850;white-space:nowrap}
    input[type="color"]{width:40px;height:30px;border:0;outline:0;border-radius:999px;background:rgba(255,255,255,.70);padding:3px}
    input[type="range"]{width:112px;accent-color:#2468ff}
    .brush-readout{min-width:30px;text-align:right;color:var(--ink)}

    .editor-layout{display:grid;grid-template-columns:minmax(520px,1fr) 360px;min-height:650px}
    .stage-shell{position:relative;min-height:650px;padding:22px;overflow:auto;display:flex;justify-content:center;align-items:flex-start;border-right:1px solid rgba(255,255,255,.42)}
    .paper-frame{display:none;position:relative;padding:16px;border:1px solid rgba(255,255,255,.76);border-radius:26px;background:rgba(255,255,255,.66);box-shadow:0 24px 70px rgba(0,30,50,.22);line-height:0}
    .page-stack{position:relative;line-height:0;overflow:visible}
    #pdfCanvas,#editCanvas{display:block;border-radius:8px}
    #pdfCanvas{background:#fff;box-shadow:0 12px 28px rgba(0,30,50,.15)}
    #editCanvas{position:absolute;inset:0;cursor:crosshair;touch-action:none;z-index:5}
    #redactionHandles{position:absolute;inset:0;z-index:8;display:none;pointer-events:none;line-height:1}
    .mode-redact #redactionHandles{display:block}
    .redaction-close{position:absolute;width:22px;height:22px;min-height:22px;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.94);background:rgba(7,50,66,.88);color:transparent;font-size:0;line-height:0;box-shadow:0 8px 20px rgba(0,30,50,.25);pointer-events:auto;cursor:pointer;overflow:visible}
    .redaction-close::before,.redaction-close::after{content:"";position:absolute;left:50%;top:50%;width:10px;height:2px;border-radius:999px;background:#fff;transform-origin:center;pointer-events:none}
    .redaction-close::before{transform:translate(-50%,-50%) rotate(45deg)}
    .redaction-close::after{transform:translate(-50%,-50%) rotate(-45deg)}
    .redaction-close:hover{background:#ff58b8;transform:scale(1.06)}
    #elementLayer{position:absolute;inset:0;z-index:7;display:none;line-height:1;pointer-events:auto}
    .mode-redact #editCanvas{display:block}
    .mode-redact #elementLayer{display:none}
    .mode-elements #editCanvas{display:none}
    .mode-elements #elementLayer{display:block}

    .empty{width:min(760px,calc(100% - 44px));min-height:390px;margin:48px auto;border-radius:34px;border:1.5px dashed rgba(255,255,255,.80);background:rgba(255,255,255,.54);box-shadow:0 24px 70px rgba(0,42,66,.14);display:grid;place-items:center;text-align:center;padding:30px}
    .empty h1{margin:0 0 10px;font-size:clamp(34px,5vw,58px);line-height:1.02;letter-spacing:.02em}
    .empty p{max-width:570px;margin:0 auto 20px;color:var(--muted);line-height:1.8}

    .side{padding:14px;background:rgba(255,255,255,.18);overflow:auto}
    .side-panel{display:none}
    .side-panel.active{display:block}
    .side h3{margin:2px 0 10px;font-size:15px}
    .summary-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
    .metric{border:1px solid rgba(255,255,255,.66);border-radius:20px;background:rgba(255,255,255,.50);padding:12px;min-width:0}
    .metric b{display:block;font-size:22px;line-height:1.1}
    .metric span{display:block;margin-top:4px;color:var(--muted);font-size:12px;font-weight:800}
    .list{display:grid;gap:8px;max-height:390px;overflow:auto;padding-right:2px}
    .list-item{border:1px solid rgba(255,255,255,.66);border-radius:16px;background:rgba(255,255,255,.52);padding:10px;cursor:pointer;display:grid;gap:4px;font-size:12px}
    .list-item:hover{background:rgba(255,255,255,.76)}
    .list-item.active{outline:2px solid rgba(36,104,255,.75);background:rgba(255,255,255,.86)}
    .list-item b{font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .list-item span{color:var(--muted);font-weight:750}
    .prop-box{margin:12px 0;border:1px solid rgba(255,255,255,.66);border-radius:20px;background:rgba(255,255,255,.50);padding:12px;display:grid;gap:8px}
    .prop-box label{display:grid;gap:5px;color:var(--muted);font-size:12px;font-weight:850}
    .prop-box input,.prop-box textarea,.prop-box select{width:100%;border:1px solid rgba(255,255,255,.75);border-radius:14px;background:rgba(255,255,255,.72);padding:9px 10px;color:var(--ink);outline:0;font-weight:750}
    .prop-box textarea{min-height:82px;resize:vertical}
    .prop-actions{display:flex;flex-wrap:wrap;gap:8px}
    .side-note{display:none}

    .element-box{position:absolute;border:1.8px solid rgba(36,104,255,.72);background:rgba(36,104,255,.08);border-radius:7px;cursor:move;transform-origin:center center;user-select:none;touch-action:none;overflow:visible;box-shadow:0 0 0 1px rgba(255,255,255,.68)}
    .element-box.text{border-color:rgba(36,104,255,.82);background:rgba(36,104,255,.08)}
    .element-box.annotation{border-color:rgba(255,88,184,.72);background:rgba(255,88,184,.08)}
    .element-box.image{border-color:rgba(0,191,212,.86);background:rgba(0,191,212,.09)}
    .element-box.text-preview,.element-box.image-preview{background:#fff;overflow:hidden}
    .element-box.text-preview .element-content{background:#fff;color:rgba(7,50,66,.94);white-space:pre-wrap;text-overflow:clip;line-height:1.15;padding:2px 4px}
    .element-box.image-preview .element-content{padding:0;background:#fff;overflow:hidden}
    .element-box.image-preview img,.element-box.text-snapshot img{display:block;width:100%;height:100%;object-fit:fill}
    .erase-patch{position:absolute;z-index:1;background:#fff;border-radius:4px;box-shadow:0 0 0 1px rgba(255,255,255,.54);pointer-events:none}
    .element-box{z-index:2}
    .element-box.hidden-el{opacity:.32;filter:grayscale(.4)}
    .element-box.selected{border-color:rgba(255,88,184,1);background:rgba(255,88,184,.10);box-shadow:0 0 0 2px rgba(255,255,255,.92),0 10px 30px rgba(255,88,184,.22)}
    .element-content{position:absolute;inset:0;padding:2px 4px;font-weight:800;color:rgba(7,50,66,.92);font-size:12px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:rgba(255,255,255,.22)}
    .element-content[contenteditable="true"]{cursor:text;outline:0;white-space:pre-wrap;overflow:auto;background:rgba(255,255,255,.88);caret-color:#2468ff}
    .capture-rect{position:absolute;border:2px dashed rgba(255,88,184,.98);background:rgba(255,255,255,.45);border-radius:8px;box-shadow:0 0 0 9999px rgba(7,50,66,.08);pointer-events:none;z-index:10}
    .tool-btn.armed{color:#fff;background:linear-gradient(135deg,#ff58b8,#7668ff);border-color:rgba(255,255,255,.86)}
    .element-label{position:absolute;left:0;top:-20px;border-radius:999px;background:rgba(7,50,66,.84);color:#fff;font-size:11px;line-height:16px;padding:0 7px;white-space:nowrap;box-shadow:0 8px 18px rgba(0,0,0,.15)}
    .resize-handle{position:absolute;right:-7px;bottom:-7px;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--blue);cursor:nwse-resize}
    .rotate-handle{position:absolute;left:50%;top:-34px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#fff;border:2px solid var(--pink);cursor:grab}
    .rotate-handle:after{content:"";position:absolute;left:7px;top:14px;width:2px;height:18px;background:rgba(255,88,184,.72)}
    .hint{display:none}
    .mode-redact .editor-layout{grid-template-columns:1fr}
    .mode-redact .side{display:none}
    .mode-elements .editor-layout{grid-template-columns:1fr}
    .mode-elements .side{display:none}
    .toast{position:fixed;left:50%;bottom:24px;z-index:50;transform:translateX(-50%) translateY(16px);opacity:0;pointer-events:none;padding:12px 16px;border-radius:999px;background:rgba(6,42,53,.92);color:#fff;font-size:14px;box-shadow:0 16px 44px rgba(0,0,0,.22);transition:opacity .2s ease,transform .2s ease}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .print-frame{position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0;pointer-events:none}
    .dragover .workspace,.dragover .empty,.dragover .paper-frame{outline:3px solid rgba(255,240,87,.85);outline-offset:-8px}


    @keyframes softReveal{from{opacity:0;transform:translateY(-6px) scale(.992)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes softRise{from{opacity:0;transform:translateY(10px) scale(.992)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes closePop{0%{opacity:0;transform:scale(.62) rotate(-24deg)}70%{opacity:1;transform:scale(1.10) rotate(4deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
    @keyframes listIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .panel,.scopebar,.workspace,.workspace-head,.toolbars,.stage-shell,.side,.empty,.paper-frame{transition:background .22s ease,border-color .22s ease,box-shadow .22s ease,opacity .22s ease,transform .22s ease}
    .mode-toolbar.active{animation:softReveal .22s cubic-bezier(.2,.8,.2,1)}
    .paper-frame{animation:softRise .24s cubic-bezier(.2,.8,.2,1)}
    .workspace.rendering .paper-frame{opacity:.72;transform:scale(.996)}
    .redaction-close{animation:closePop .18s cubic-bezier(.2,.8,.2,1);transition:opacity .18s ease,transform .18s ease,background .18s ease,box-shadow .18s ease}
    .element-box{transition:opacity .16s ease,filter .16s ease,box-shadow .16s ease,background .16s ease,border-color .16s ease}
    .element-box.dragging{transition:none!important;animation:none!important}
    .element-box.text-editing{background:rgba(255,255,255,.93);border-color:rgba(255,88,184,1);box-shadow:0 0 0 2px rgba(255,255,255,.94),0 12px 32px rgba(36,104,255,.18)}
    .list-item{animation:listIn .18s ease both}
    @media (prefers-reduced-motion: reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

    @media(max-width:1180px){.top-grid,.scope-inner,.mode-toolbar,.workspace-head{grid-template-columns:1fr}.top-actions{justify-content:flex-start}.editor-layout{grid-template-columns:1fr}.stage-shell{border-right:0;border-bottom:1px solid rgba(255,255,255,.42)}.side{min-height:auto}}
    @media(max-width:720px){.app{width:min(100vw - 16px,1500px);margin-top:8px;gap:8px}.panel{border-radius:22px}.topbar{padding:10px}button,.file-btn,.chip,.field{flex:1 1 auto}.stage-shell{padding:12px;min-height:520px}.empty{width:calc(100% - 24px);margin:24px auto;min-height:340px}.range-input{width:100%}}
  </style>
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>

  <main id="app" class="app">
    <section class="panel topbar" aria-label="主要操作">
      <div class="top-grid">
        <div class="brand">
          <div class="logo" aria-hidden="true"></div>
          <div>
            <strong>anti_vip PDF 工具箱</strong>
            <span>本地处理 · 不上传</span>
          </div>
        </div>
        <div class="mode-tabs" aria-label="功能入口">
          <button id="elementsMode" class="mode-btn" type="button">页面元素编辑</button>
          <button id="redactMode" class="mode-btn active" type="button">涂抹删除章子</button>
        </div>
        <div class="top-actions">
          <label class="file-btn" for="fileInput">打开 PDF</label>
          <input id="fileInput" type="file" accept="application/pdf,.pdf" />
          <button id="savePdf" class="primary" type="button" disabled>保存 PDF</button>
          <button id="printPdf" class="print" type="button" disabled>直接打印</button>
        </div>
      </div>
    </section>

    <section id="scopebar" class="panel scopebar" aria-label="批量应用范围">
      <div class="scope-inner">
        <div class="scope-title">批量应用到</div>
        <div class="scope-row">
          <button id="scopeCurrent" class="scope-btn active" type="button" data-scope="current">当前页</button>
          <button id="scopeAll" class="scope-btn" type="button" data-scope="all">所有页面</button>
          <button id="scopeCustom" class="scope-btn" type="button" data-scope="custom">指定范围</button>
          <input id="customRange" class="range-input" type="text" placeholder="例如：1-3,5,8" disabled />
        </div>
        <div id="scopeHint" class="mini-note">应用范围：当前页</div>
      </div>
    </section>

    <section id="workspace" class="panel workspace mode-redact" aria-label="PDF 工作区">
      <div class="workspace-head">
        <div class="status">
          <strong id="statusTitle">还没有打开 PDF</strong>
          <span id="statusText">就绪</span>
        </div>
        <div class="page-actions">
          <button id="prevPage" type="button" disabled>上一页</button>
          <span id="pageIndicator" class="chip">未加载 PDF</span>
          <button id="nextPage" type="button" disabled>下一页</button>
          <button id="zoomOut" type="button" disabled>缩小</button>
          <button id="zoomIn" type="button" disabled>放大</button>
          <span id="changeCount" class="chip">0 个修改</span>
        </div>
      </div>

      <div class="toolbars">
        <div id="redactToolbar" class="mode-toolbar active">
          <div class="tool-row">
            <button id="rectTool" class="tool-btn active" type="button">框选遮盖</button>
            <button id="brushTool" class="tool-btn" type="button">涂抹笔</button>
            <button id="undoEdit" type="button" disabled>撤销一步</button>
            <button id="clearEdits" class="dangerish" type="button" disabled>清空遮盖</button>
          </div>
          <div class="tool-row">
            <label class="field">颜色 <input id="coverColor" type="color" value="#ffffff" /></label>
            <label class="field">笔粗 <input id="brushSize" type="range" min="8" max="90" value="39" /> <span id="brushReadout" class="brush-readout">39</span></label>
          </div>
        </div>

        <div id="elementsToolbar" class="mode-toolbar">
          <div class="tool-row">
            <button id="parseCurrent" type="button" disabled>解析当前页</button>
            <button id="parseAll" class="primary" type="button" disabled>解析全部页</button>
            <button id="selectElementTool" class="tool-btn active" type="button" disabled>选择对象</button>
            <button id="captureObject" class="tool-btn" type="button" disabled>框选成对象</button>
            <button id="addText" type="button" disabled>添加文字</button>
            <button id="editSelectedText" type="button" disabled>直接改字</button>
            <button id="hideElement" type="button" disabled>盖掉所选</button>
            <button id="resetPage" class="dangerish" type="button" disabled>重置本页</button>
          </div>
          <div class="tool-row">
            <button id="rotateLeft" type="button" disabled>左转 15°</button>
            <button id="rotateRight" type="button" disabled>右转 15°</button>
            <button id="smallerText" type="button" disabled>缩小</button>
            <button id="biggerText" type="button" disabled>放大</button>
          </div>
        </div>
      </div>

      <div class="editor-layout">
        <div id="stageShell" class="stage-shell">
          <div id="emptyState" class="empty">
            <div>
              <h1>打开 PDF</h1>
              <p>拖入或选择 PDF 文件。</p>
              <label class="file-btn" for="fileInput">选择 PDF</label>
            </div>
          </div>
          <div id="paperFrame" class="paper-frame">
            <div id="pageStack" class="page-stack">
              <canvas id="pdfCanvas"></canvas>
              <div id="elementLayer" aria-label="PDF 构成编辑层"></div>
              <canvas id="editCanvas" aria-label="PDF 涂抹编辑层"></canvas>
              <div id="redactionHandles" aria-label="遮盖区域控制层"></div>
            </div>
          </div>
        </div>

        <aside class="side" aria-label="对象属性">
          <div id="redactSide" class="side-panel active">
            <h3>涂抹删除章子</h3>
            <div class="summary-cards">
              <div class="metric"><b id="mRedactions">0</b><span>遮盖层</span></div>
              <div class="metric"><b id="mTargets">所有</b><span>默认范围</span></div>
            </div>
            <div id="redactionList" class="list"><div class="list-item"><b>暂无遮盖</b><span>—</span></div></div>
            
          </div>

        m1[1]*m2[2]+m1[3]*m2[3],

    function addTextElement(){if(!state.pdf||!state.viewport)return;let els=elementsForPage();if(!state.elementsByPage.has(state.currentPage)){state.elementsByPage.set(state.currentPage,els)}const el={id:'p'+state.currentPage+'_new_'+Date.now(),pageNo:state.currentPage,type:'text',label:'新增文字',text:'输入文字',originalText:'',x:.32,y:.42,w:.28,h:.045,angle:0,fontSize:.028,fontFamily:'"Microsoft YaHei", "PingFang SC", Arial, sans-serif',fontWeight:'800',color:'#073242',hidden:false,modified:true,added:true,forceTextEdit:true,orig:null};els.push(el);state.selectedId=el.id;invalidateOutput();renderElementLayer();updateSidePanels();setButtons();beginTextEdit(el.id);toast('已添加文字块')}
    function hideSelected(){const el=selectedElement();if(!el)return;if(el.added){const els=elementsForPage();state.elementsByPage.set(state.currentPage,els.filter(e=>e.id!==el.id));state.selectedId=null}else{el.hidden=true;el.modified=true}invalidateOutput();renderElementLayer();updateSidePanels();setButtons();toast('已标记为盖掉')}
    function resetCurrentPage(){if(!state.pdf)return;state.elementsByPage.delete(state.currentPage);state.selectedId=null;invalidateOutput();renderElementLayer();updateSidePanels();setButtons();toast('本页构成编辑已重置')}
    function rotateSelected(delta){const el=selectedElement();if(!el||!(el.type==='text'||el.type==='image'))return;el.angle=(el.angle+delta)%360;el.modified=true;invalidateOutput();renderElementLayer();updateSidePanels();setButtons()}
    function scaleSelected(factor){const el=selectedElement();if(!el||!(el.type==='text'||el.type==='image'))return;const cx=el.x+el.w/2,cy=el.y+el.h/2;el.w=Math.max(.015,Math.min(.95,el.w*factor));el.h=Math.max(.012,Math.min(.95,el.h*factor));el.x=Math.max(0,Math.min(.98,cx-el.w/2));el.y=Math.max(0,Math.min(.98,cy-el.h/2));el.fontSize=Math.max(.006,el.h*.72);el.modified=true;invalidateOutput();renderElementLayer();updateSidePanels();setButtons()}
    function applySelectedText(){const el=selectedElement();if(!el||el.type!=='text')return;el.text=$('selectedText').value;el.modified=true;invalidateOutput();renderElementLayer();updateSidePanels();setButtons();toast('文字已更新')}

    async function analyzeCounts(pageNo){
      try{const page=await state.pdf.getPage(pageNo);const text=await page.getTextContent();const textItems=text.items.filter(item=>(item.str||'').trim()).length;const ann=(await page.getAnnotations()).length;return{textItems,ann}}catch(_){return{textItems:0,ann:0}}
    }
    function updateSidePanels(){
      $('mRedactions').textContent=state.redactions.length;renderRedactionList();
      const els=elementsForPage();const changed=els.filter(el=>el.added||el.modified||el.hidden).length;$('mElements').textContent=els.length;$('mText').textContent=els.filter(el=>el.type==='text').length;$('mOther').textContent=els.filter(el=>el.type!=='text').length;$('mChanged').textContent=changed;renderElementList();const sel=selectedElement();$('selectedLabel').value=sel?elKind(sel)+' · '+sel.label:'未选择';if(document.activeElement!==$('selectedText'))$('selectedText').value=sel&&sel.type==='text'?sel.text:'';if(sel&&sel.type==='text'){$('selectedFont').value=sel.fontFamily||'"Microsoft YaHei", "PingFang SC", Arial, sans-serif';$('selectedColor').value=sel.color||'#073242'}
    }
    function renderRedactionList(){const box=$('redactionList');if(!state.redactions.length){box.innerHTML='<div class="list-item"><b>暂无遮盖</b><span>—</span></div>';return}box.innerHTML=state.redactions.map((e,i)=>'<div class="list-item"><b>'+(i+1)+'. '+(e.type==='rect'?'框选遮盖':'涂抹笔迹')+'</b><span>'+pageRangeLabel(e.scope)+'</span></div>').join('')}
    function renderElementList(){const box=$('elementList'),els=elementsForPage();if(!els.length){box.innerHTML='<div class="list-item"><b>暂无对象</b><span>—</span></div>';return}box.innerHTML=els.map(el=>'<div class="list-item '+(el.id===state.selectedId?'active':'')+'" data-id="'+el.id+'"><b>'+escapeHtml(el.label)+' '+(el.hidden?'（已盖掉）':'')+'</b><span>'+elKind(el)+' · '+escapeHtml(el.type==='text'?el.text.slice(0,30):el.text)+'</span></div>').join('');box.querySelectorAll('.list-item[data-id]').forEach(item=>item.addEventListener('click',()=>selectElement(item.dataset.id)))}

    function textPngBytes(text,widthPt,heightPt,fontPt,color,fontWeight,fontFamily){
      const scale=3;const canvas=document.createElement('canvas');canvas.width=Math.max(40,Math.ceil(widthPt*scale));canvas.height=Math.max(24,Math.ceil(heightPt*scale));const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle=color||'#073242';ctx.textBaseline='top';const family=fontFamily&&fontFamily!=='system-ui'?fontFamily:'"Microsoft YaHei", "PingFang SC", Arial, sans-serif';ctx.font=(fontWeight||'800')+' '+Math.max(8,fontPt*scale)+'px '+family;const lines=String(text||'').split(/\n/);const lineH=Math.max(10,fontPt*scale*1.22);lines.forEach((line,i)=>ctx.fillText(line,2,Math.max(1,i*lineH)));return fetch(canvas.toDataURL('image/png')).then(r=>r.arrayBuffer())
    }
    function dataUrlBytes(dataUrl){return fetch(dataUrl).then(r=>r.arrayBuffer())}
    function outputSignature(){const pages=[];for(const [page,els] of state.elementsByPage.entries())pages.push([page,els.filter(el=>el.added||el.modified||el.hidden)]);return JSON.stringify({file:state.fileName,total:state.totalPages,redactions:state.redactions,elements:pages})}
    function changedPageSet(){
      const set=new Set();
      state.redactions.forEach(edit=>{if(edit.scope.mode==='all'){for(let p=1;p<=state.totalPages;p++)set.add(p)}else edit.scope.pages.forEach(p=>set.add(p))});
      for(const [pageNo,els] of state.elementsByPage.entries()){if(els.some(el=>el.added||el.modified||el.hidden))set.add(Number(pageNo))}
      return set;
    }
    async function imageFromDataUrl(dataUrl){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=dataUrl})}
    function drawWrappedCanvasText(ctx,text,w,h,fontPx,lineHeight){
      const paragraphs=String(text||'').split(/\n/);let y=0;
      for(const para of paragraphs){
        let line='';const chars=[...para];
        for(const ch of chars){
          const trial=line+ch;
          if(line&&ctx.measureText(trial).width>w-6){ctx.fillText(line,3,y);y+=lineHeight;line=ch;if(y>h-lineHeight*.2)return}
          else line=trial;
        }
        if(line||!para){ctx.fillText(line,3,y);y+=lineHeight;if(y>h-lineHeight*.2)return}
      }
    }
    async function drawElementsOnCanvas(ctx,pageNo,W,H){
      const els=state.elementsByPage.get(pageNo)||[];
      for(const el of els){
        if(!el.added&&(el.modified||el.hidden)){const o=el.orig||el;ctx.save();ctx.fillStyle='#fff';ctx.fillRect(Math.max(0,(o.x-.003)*W),Math.max(0,(o.y-.003)*H),Math.min(W,(o.w+.006)*W),Math.min(H,(o.h+.006)*H));ctx.restore()}
      }
      for(const el of els){
        if(el.hidden)continue;
        if(!(el.added||el.modified))continue;
        if(!(el.type==='text'||el.type==='image'))continue;
        const x=el.x*W,y=el.y*H,w=Math.max(4,el.w*W),h=Math.max(4,el.h*H);
        ctx.save();ctx.translate(x+w/2,y+h/2);ctx.rotate((el.angle||0)*Math.PI/180);ctx.translate(-w/2,-h/2);
        try{
          if(el.type==='image'&&el.snapshotDataUrl){const img=await imageFromDataUrl(el.snapshotDataUrl);ctx.drawImage(img,0,0,w,h)}
          else if(el.type==='text'&&!el.added&&el.text===el.originalText&&el.snapshotDataUrl){const img=await imageFromDataUrl(el.snapshotDataUrl);ctx.drawImage(img,0,0,w,h)}
          else if(el.type==='text'){
            const fontPx=Math.max(7,(el.fontSize||el.h*.72)*H);const family=el.fontFamily||'"Microsoft YaHei", "PingFang SC", Arial, sans-serif';
            ctx.fillStyle=el.color||'#073242';ctx.textBaseline='top';ctx.font=(el.fontWeight||'800')+' '+fontPx+'px '+family;
            drawWrappedCanvasText(ctx,el.text,w,h,fontPx,fontPx*1.22);
          }
        }finally{ctx.restore()}
      }
    }
    function drawRedactionsOnCanvas(ctx,pageNo,W,H){
      state.redactions.forEach(edit=>{
        if(!editAppliesToPage(edit,pageNo))return;ctx.save();ctx.fillStyle=hexToCanvas(edit.color,edit.opacity==null?1:edit.opacity);
        if(edit.type==='rect')ctx.fillRect(edit.x*W,edit.y*H,edit.width*W,edit.height*H);
        else if(edit.type==='stroke'){ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=Math.max(1,edit.brush*W);ctx.strokeStyle=hexToCanvas(edit.color,edit.opacity==null?1:edit.opacity);ctx.beginPath();(edit.points||[]).forEach((p,i)=>{const x=p.x*W,y=p.y*H;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke()}
        ctx.restore();
      });
    }
    async function renderFlattenedPageCanvas(pageNo){
      const page=await state.pdf.getPage(pageNo);const base=page.getViewport({scale:1});const scale=Math.min(3,Math.max(2,2200/base.width));const viewport=page.getViewport({scale});
      const canvas=document.createElement('canvas');canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);const ctx=canvas.getContext('2d',{alpha:false});ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);await page.render({canvasContext:ctx,viewport}).promise;
      drawRedactionsOnCanvas(ctx,pageNo,canvas.width,canvas.height);await drawElementsOnCanvas(ctx,pageNo,canvas.width,canvas.height);return canvas;
    }
    async function buildVectorPdfBlobUrl(signature){
      setStatus('正在生成 PDF','正在把遮盖层写入 PDF 页面。');const pdfDoc=await PDFLib.PDFDocument.load(state.pdfBytes.slice(0),{ignoreEncryption:true});const pages=pdfDoc.getPages();
      state.redactions.forEach(edit=>{pages.forEach((page,index)=>{const pageNo=index+1;if(!editAppliesToPage(edit,pageNo))return;const size=page.getSize();const color=hexToRgb01(edit.color);const rgb=PDFLib.rgb(color.r,color.g,color.b);if(edit.type==='rect'){page.drawRectangle({x:edit.x*size.width,y:size.height-(edit.y+edit.height)*size.height,width:edit.width*size.width,height:edit.height*size.height,color:rgb,opacity:edit.opacity,borderWidth:0})}else if(edit.type==='stroke'){for(let i=1;i<edit.points.length;i++){const a=edit.points[i-1],b=edit.points[i];page.drawLine({start:{x:a.x*size.width,y:size.height-a.y*size.height},end:{x:b.x*size.width,y:size.height-b.y*size.height},thickness:Math.max(1,edit.brush*size.width),color:rgb,opacity:edit.opacity})}}})});
      const out=await pdfDoc.save({useObjectStreams:true});const blob=new Blob([out],{type:'application/pdf'});invalidateOutput();state.lastBlobUrl=URL.createObjectURL(blob);state.lastSignature=signature;setStatus('PDF 已生成','处理完成。');return state.lastBlobUrl;
    }
    async function buildVisualPdfBlobUrl(signature){
      setStatus('正在生成 PDF','正在按屏幕效果重绘修改页。');const srcDoc=await PDFLib.PDFDocument.load(state.pdfBytes.slice(0),{ignoreEncryption:true});const outDoc=await PDFLib.PDFDocument.create();const pages=srcDoc.getPages();const changed=changedPageSet();
      for(let i=0;i<pages.length;i++){
        const pageNo=i+1;setStatus('正在生成 PDF','第 '+pageNo+' / '+pages.length+' 页');
        if(!changed.has(pageNo)){const [copied]=await outDoc.copyPages(srcDoc,[i]);outDoc.addPage(copied);continue}
        const size=pages[i].getSize();const canvas=await renderFlattenedPageCanvas(pageNo);const png=await dataUrlBytes(canvas.toDataURL('image/png'));const img=await outDoc.embedPng(png);const page=outDoc.addPage([size.width,size.height]);page.drawImage(img,{x:0,y:0,width:size.width,height:size.height});
      }
      const out=await outDoc.save({useObjectStreams:true});const blob=new Blob([out],{type:'application/pdf'});invalidateOutput();state.lastBlobUrl=URL.createObjectURL(blob);state.lastSignature=signature;setStatus('PDF 已生成','处理完成。');return state.lastBlobUrl;
    }
    async function buildPdfBlobUrl(){
      if(!state.pdfBytes)throw new Error('请先打开 PDF');if(!window.PDFLib)throw new Error('PDF 处理组件还没加载完成，请稍后再试');if(!state.redactions.length&&!hasElementChanges())throw new Error('还没有修改内容');const signature=outputSignature();if(state.lastBlobUrl&&state.lastSignature===signature)return state.lastBlobUrl;
      if(hasElementChanges())return buildVisualPdfBlobUrl(signature);
      return buildVectorPdfBlobUrl(signature);
    }
    async function savePdf(){try{$('savePdf').disabled=true;$('printPdf').disabled=true;const url=await buildPdfBlobUrl();const link=document.createElement('a');link.href=url;link.download=(state.fileName||'processed')+'_处理后.pdf';document.body.appendChild(link);link.click();link.remove();toast('已生成 PDF')}catch(err){console.error(err);setStatus('保存失败',err.message||'生成 PDF 时出错。');toast(err.message||'保存失败')}finally{setButtons()}}
    async function printPdf(){try{$('savePdf').disabled=true;$('printPdf').disabled=true;const url=await buildPdfBlobUrl();printFrame.onload=()=>{setTimeout(()=>{try{printFrame.contentWindow.focus();printFrame.contentWindow.print();toast('已打开打印窗口')}catch(err){window.open(url,'_blank');toast('已打开新标签页')}},450)};printFrame.src=url}catch(err){console.error(err);setStatus('打印失败',err.message||'生成打印 PDF 时出错。');toast(err.message||'打印失败')}finally{setButtons()}}

    fileInput.addEventListener('change',evt=>loadPdf(evt.target.files[0]));
    ['dragenter','dragover'].forEach(name=>document.addEventListener(name,evt=>{evt.preventDefault();app.classList.add('dragover')}));
    ['dragleave','drop'].forEach(name=>document.addEventListener(name,evt=>{evt.preventDefault();app.classList.remove('dragover')}));
    document.addEventListener('drop',evt=>loadPdf(evt.dataTransfer.files[0]));
    $('redactMode').addEventListener('click',async()=>{setMode('redact');if(state.pdf)await renderPage(state.currentPage)});
    $('elementsMode').addEventListener('click',async()=>{setMode('elements');if(state.pdf){await renderPage(state.currentPage);if(!state.elementsByPage.has(state.currentPage))parseCurrentPage(false)}});
    document.querySelectorAll('.scope-btn').forEach(btn=>btn.addEventListener('click',()=>setScope(btn.dataset.scope)));
    $('rectTool').addEventListener('click',()=>setTool('rect'));$('brushTool').addEventListener('click',()=>setTool('brush'));
    $('undoEdit').addEventListener('click',()=>{if(!state.redactions.length)return;const removed=state.redactions.pop();queueRedactionExit(removed);invalidateOutput();drawRedactionOverlay();updateSidePanels();setButtons();toast('已撤销一步')});
    $('clearEdits').addEventListener('click',()=>{if(!state.redactions.length)return;state.redactions.forEach(queueRedactionExit);state.redactions=[];invalidateOutput();drawRedactionOverlay();updateSidePanels();setButtons();toast('已清空遮盖')});
    $('prevPage').addEventListener('click',async()=>{if(state.currentPage>1){state.currentPage--;state.selectedId=null;await renderPage(state.currentPage)}});
    $('nextPage').addEventListener('click',async()=>{if(state.currentPage<state.totalPages){state.currentPage++;state.selectedId=null;await renderPage(state.currentPage)}});
    $('zoomOut').addEventListener('click',async()=>{if(!state.pdf)return;state.scale=Math.max(.35,(state.scale||1)*.88);await renderPage(state.currentPage)});
    $('zoomIn').addEventListener('click',async()=>{if(!state.pdf)return;state.scale=Math.min(2.6,(state.scale||1)*1.14);await renderPage(state.currentPage)});
    $('brushSize').addEventListener('input',()=>{$('brushReadout').textContent=$('brushSize').value});$('coverColor').addEventListener('input',()=>drawRedactionOverlay());
    $('savePdf').addEventListener('click',savePdf);$('printPdf').addEventListener('click',printPdf);
    $('selectedText').addEventListener('input',()=>{const el=selectedElement();if(!el||el.type!=='text')return;el.text=$('selectedText').value;el.modified=true;el.forceTextEdit=true;invalidateOutput();renderElementLayer();setButtons()});
    $('selectedFont').addEventListener('change',()=>{const el=selectedElement();if(!el||el.type!=='text')return;el.fontFamily=$('selectedFont').value;el.modified=true;invalidateOutput();renderElementLayer();setButtons()});
    $('selectedColor').addEventListener('input',()=>{const el=selectedElement();if(!el||el.type!=='text')return;el.color=$('selectedColor').value;el.modified=true;invalidateOutput();renderElementLayer();setButtons()});
    $('selectElementTool').addEventListener('click',()=>setElementTool('select'));
    $('captureObject').addEventListener('click',()=>setElementTool(state.elementTool==='capture'?'select':'capture'));
    $('parseCurrent').addEventListener('click',()=>parseCurrentPage(true));$('parseAll').addEventListener('click',parseAllPages);$('addText').addEventListener('click',addTextElement);$('hideElement').addEventListener('click',hideSelected);$('deleteSelected').addEventListener('click',hideSelected);$('resetPage').addEventListener('click',resetCurrentPage);$('rotateLeft').addEventListener('click',()=>rotateSelected(-15));$('rotateRight').addEventListener('click',()=>rotateSelected(15));$('smallerText').addEventListener('click',()=>scaleSelected(.88));$('biggerText').addEventListener('click',()=>scaleSelected(1.14));$('applyText').addEventListener('click',applySelectedText);
    window.addEventListener('resize',()=>{clearTimeout(window.__resizeTimer);window.__resizeTimer=setTimeout(()=>{if(state.pdf&&!state.rendering)renderPage(state.currentPage)},240)});
    document.addEventListener('keydown',evt=>{if((evt.ctrlKey||evt.metaKey)&&evt.key.toLowerCase()==='s'){evt.preventDefault();if(!$('savePdf').disabled)savePdf()}if((evt.ctrlKey||evt.metaKey)&&evt.key.toLowerCase()==='p'){evt.preventDefault();if(!$('printPdf').disabled)printPdf()}if(evt.key==='Escape'){state.activeRect=null;state.activeStroke=null;state.captureRect=null;pointerSession=null;elementSession=null;captureSession=null;setElementTool('select');drawRedactionOverlay();toast('已取消当前操作')}});
    setScope('current');setTool('rect');setMode('redact');setButtons();loadDefaultBlankPdf();
  </script>
